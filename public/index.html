<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videothek</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css?v=20261021d">
</head>
<body>

<header>
  <div class="eyebrow">Heute ist Filmabend</div>
  <h1>Die Videothek</h1>
  <p class="sub" id="subCount">wird geladen &hellip;</p>
</header>

<div class="controls">
  <input type="search" id="search" placeholder="Titel, Darsteller, Folge &hellip;" aria-label="Titel, Regie, Darsteller oder Folge suchen">
  <select id="typeSel" aria-label="Nach Art filtern">
    <option value="">Filme und Serien</option>
    <option value="movie">Nur Filme</option>
    <option value="season">Nur Serien</option>
  </select>
  <select id="genreSel" aria-label="Nach Genre filtern"><option value="">Alle Genres</option></select>
  <select id="mediumSel" aria-label="Nach Medium filtern"><option value="">Alle Medien</option></select>
  <select id="personSel" aria-label="Nach Eigentümer, Ausleihe oder Wunschliste filtern" hidden><option value="">Alle Personen</option></select>
  <select id="sortSel" aria-label="Sortierung">
    <option value="title">Alphabetisch</option>
    <option value="year-desc">Erscheinungsjahr &uarr;</option>
    <option value="year-asc">Erscheinungsjahr &darr;</option>
    <option value="created-desc">Hinzugefügt &uarr;</option>
    <option value="created-asc">Hinzugefügt &darr;</option>
    <option value="rating">Bewertung &uarr;</option>
    <option value="rating-asc">Bewertung &darr;</option>
  </select>
  <button class="btn btn-primary" id="importMovieBtn" type="button">+ Neu</button>
</div>
<p class="count" id="resultCount"></p>

<div class="grid" id="grid">
  <!-- Bis die Filme geladen sind; renderGrid() in app.js ersetzt es durch die Kacheln -->
  <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Filme werden geladen &hellip;</div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="app.js?v=20261021d"></script>
</body>
</html>
